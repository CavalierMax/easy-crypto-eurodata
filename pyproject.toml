[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "easycrypto-tax"
version = "0.1.0"
description = "Motore fiscale LIFO per cripto-attivita - periodo d'imposta 2025"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

